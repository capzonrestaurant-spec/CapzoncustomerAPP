name: Build Capzon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Capzon project
        run: |
          mkdir capzon
          unzip -q CapzonCustomerApp_MVP.zip -d capzon
          sed -i '/import androidx.appcompat.app.AppCompatActivity/a import androidx.core.widget.addTextChangedListener' capzon/app/src/main/java/com/capzon/customer/MainActivity.kt

      - name: Build APK
        working-directory: capzon
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Capzon-Customer-App
          path: capzon/app/build/outputs/apk/debug/app-debug.apk
